[build]
  command = "bash scripts/web_build.sh"
  publish = "build/web"

# Le clone du SDK Flutter demande un peu de temps au premier build.
# SUPABASE_URL est un secret Netlify (dashboard / CLI). Le scan ne doit pas
# échouer parce que Flutter l'injecte dans le bundle client (.env asset).
[build.environment]
  NODE_VERSION = "20"
  APP_ENV = "prod"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# App Flutter en single-page : tout chemin inconnu renvoie index.html.
# Netlify sert d'abord les fichiers existants, les assets ne sont donc pas
# interceptés par cette règle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
