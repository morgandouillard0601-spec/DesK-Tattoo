<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistance — DesK Tattoo</title>
  <meta name="description" content="Contacte l’équipe DesK Tattoo en cas de bug ou de question." />
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161616;
      --line: #2a2a2a;
      --text: #f4f4f4;
      --muted: #9a9a9a;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 420px; }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      display: block;
      margin: 0 auto 14px;
    }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    form {
      margin-top: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      gap: 12px;
    }
    label { font-size: 12px; color: var(--muted); }
    input, textarea {
      width: 100%;
      margin-top: 6px;
      border: 1px solid var(--line);
      background: #111;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 12px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 700;
      background: var(--accent);
      color: #111;
      cursor: pointer;
    }
    .hidden { display: none; }
    footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
    a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="logo.png" alt="DesK Tattoo" />
      <h1>DesK Tattoo</h1>
      <p>Un bug, une question, un compte bloqué : envoie-nous un message.</p>
    </div>
    <form name="support" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="support" />
      <p class="hidden">
        <label>Ne pas remplir <input name="bot-field" /></label>
      </p>
      <label>Nom
        <input name="name" type="text" required autocomplete="name" />
      </label>
      <label>E-mail
        <input name="email" type="email" required autocomplete="email" />
      </label>
      <label>Message
        <textarea name="message" required placeholder="Décris le bug (écran, ce que tu as tapé, ce qui s’affiche)."></textarea>
      </label>
      <button type="submit">Envoyer</button>
    </form>
    <footer>
      Ou écris à <a href="mailto:morgandesk@gmail.com">morgandesk@gmail.com</a><br>
      <a href="privacy.html">Politique de confidentialité</a>
    </footer>
  </main>
</body>
</html>
